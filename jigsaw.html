<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Animal Jigsaw Puzzle &mdash; Drag &amp; Solve | Zoosi</title>
<meta name="description" content="Drag nine puzzle pieces together to reveal an animal, then hear its name in English, Hmong White, Hmong Green, and Spanish. A free jigsaw puzzle for kids.">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@600;700;800&display=swap');
  :root{
    --green-screen:#108442; --green-deep:#0D7536; --green-btn:#5CBB72; --green-btn-d:#3F9C56;
    --yellow:#F7F750; --yellow-d:#D2D244; --ink:#0D7536;
    --font:'Baloo 2','Nunito','Segoe UI',system-ui,sans-serif;
    --b:48px;                                /* control button size — fixed, same as the other games */
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{font-family:var(--font);background:var(--green-screen);margin:0;overflow:hidden;}
  .screen{position:relative;width:100vw;height:100dvh;background:var(--green-screen);overflow:hidden;display:flex;flex-direction:column;}

  .header{position:relative;padding:calc(10px + env(safe-area-inset-top)) 14px 8px;display:flex;align-items:center;justify-content:space-between;color:#fff;flex:none;z-index:90;transition:opacity .3s;}
  .header .ttl{position:absolute;left:0;right:0;text-align:center;font-weight:700;font-size:clamp(17px,2.4vw,22px);letter-spacing:.2px;pointer-events:none;}
  .icon-btn{width:38px;height:38px;border:none;background:transparent;color:#eafff0;display:grid;place-items:center;cursor:pointer;border-radius:50%;}
  .icon-btn:hover{background:rgba(255,255,255,.12);}
  .icon-btn svg{width:22px;height:22px;}
  .screen.won .header .ttl,.screen.won .header .icon-btn{opacity:.6;}

  /* animal name — big, sits above the puzzle */
  .pz-name{flex:none;text-align:center;color:#fff;font-weight:800;text-transform:lowercase;
    font-size:44px;line-height:1.05;padding:10px 16px 0;
    text-shadow:0 .05em 0 rgba(0,0,0,.16);overflow-wrap:anywhere;}

  .play{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;}
  .guide{position:absolute;border:3px dashed rgba(255,255,255,.6);border-radius:2px;
    background:rgba(255,255,255,.05);pointer-events:none;transition:opacity .4s;}
  .guide.done{opacity:0;}

  /* Pieces move with transform, never left/top. Changing left/top repaints the
     element, and mobile browsers size that repaint from the element's box —
     which excludes the drop-shadow — so the old shadow was left behind as a
     trail. A transform is composited instead, so nothing repaints. */
  .piece{position:absolute;left:0;top:0;overflow:visible;touch-action:none;user-select:none;pointer-events:none;
    filter:drop-shadow(0 4px 6px rgba(0,0,0,.30));
    transform:translate3d(0,0,0);will-change:transform;backface-visibility:hidden;}
  /* only the visible jigsaw shape is grabbable, never the empty space around its tabs */
  .piece .hit{pointer-events:visiblePainted;cursor:grab;}
  .piece image,.piece .edge{pointer-events:none;}
  .piece.locked .hit{pointer-events:none;}
  .piece.dragging .hit{cursor:grabbing;}
  .piece.dragging{filter:drop-shadow(0 12px 16px rgba(0,0,0,.38));}
  /* a locked piece never moves again, so it doesn't need its own layer */
  .piece.locked{filter:drop-shadow(0 1px 2px rgba(0,0,0,.18));will-change:auto;}
  .piece.snapping{transition:transform .18s cubic-bezier(.3,1.4,.5,1);}
  .piece.moving{transition:transform .3s ease;}
  .piece .inner{transform-box:fill-box;transform-origin:center;}
  .piece.pop .inner{animation:pop .3s ease;}
  @keyframes pop{40%{transform:scale(1.07)}}

  /* bottom bar: undo · redo · hear it · language · new game */
  .controls{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;
    width:100%;max-width:560px;margin:0 auto;padding:10px 16px calc(16px + env(safe-area-inset-bottom));}
  .rnd{flex:none;width:var(--b);height:var(--b);border-radius:50%;border:none;cursor:pointer;background:var(--green-btn);color:var(--ink);
    display:grid;place-items:center;box-shadow:0 4px 0 var(--green-btn-d);transition:transform .08s,opacity .2s;padding:0;}
  .rnd:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-btn-d);}
  .rnd svg{width:23px;height:23px;}
  .rnd.off{opacity:.4;pointer-events:none;}
  .hear{flex:0 1 auto;height:var(--b);display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;cursor:pointer;
    font-family:var(--font);font-weight:700;font-size:16px;color:var(--ink);background:var(--yellow);
    padding:0 22px;border-radius:28px;box-shadow:0 5px 0 var(--yellow-d);transition:transform .08s;white-space:nowrap;}
  .hear:active{transform:translateY(3px);box-shadow:0 2px 0 var(--yellow-d);}
  .hear svg{width:21px;height:21px;flex:none;}
  /* narrow phones: tighten the gaps so all five buttons still fit, sizes unchanged */
  @media (max-width:385px){
    .controls{gap:6px;padding-left:10px;padding-right:10px;}
    .hear{padding:0 14px;gap:6px;}
  }
  @media (max-width:340px){ .pz-name{font-size:36px;} }   /* keeps the longest name on one line */
  @media (max-width:325px){ .hear span{display:none;} .hear{width:var(--b);padding:0;} }

  .menu{position:absolute;z-index:95;background:#fff;border-radius:22px;padding:10px;box-shadow:0 18px 44px rgba(0,0,0,.30);min-width:200px;display:none;}
  .menu.open{display:block;animation:menuin .16s ease;}
  @keyframes menuin{from{opacity:0;transform:translateY(8px) scale(.97);}}
  #menu-top{top:56px;right:12px;}
  .menu-title{font-weight:800;font-size:14px;color:#8ea79a;padding:8px 14px;letter-spacing:.3px;}
  .menu-item{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;border:none;background:transparent;font-family:var(--font);font-weight:800;font-size:16px;color:#16276b;text-align:left;padding:13px 14px;border-radius:14px;cursor:pointer;}
  .menu-item:hover{background:#f2f5f2;}
  .menu-item.cur{background:#e4f3e9;color:#108442;}
  .menu-item .tick{width:18px;height:18px;color:#108442;opacity:0;flex:none;}
  .menu-item.cur .tick{opacity:1;}

  /* celebration — sits below the header and shows the finished art, uncovered */
  .win{position:absolute;left:0;right:0;bottom:0;top:var(--hdr,58px);z-index:85;display:none;flex-direction:column;align-items:center;
    background:var(--green-screen);color:#fff;text-align:center;overflow:hidden;padding:0 20px calc(18px + env(safe-area-inset-bottom));}
  .win.open{display:flex;animation:fade .35s;}
  @keyframes fade{from{opacity:0}}
  .win .pz-name{position:relative;z-index:2;text-shadow:none;}
  .w-slot{position:relative;z-index:2;flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;padding:16px 0;}
  .w-card{background:#fff;border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;animation:cardin .55s cubic-bezier(.3,1.3,.5,1);}
  .w-card img{display:block;width:100%;height:100%;object-fit:contain;}
  @keyframes cardin{from{transform:scale(.94);opacity:.4}}
  .w-text{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;}
  .win h2{position:relative;z-index:2;font-size:30px;margin:0;font-weight:800;line-height:1.1;}
  .win p{position:relative;z-index:2;margin:6px 0 0;font-weight:600;font-size:16px;opacity:.92;}
  .win-btns{position:relative;z-index:2;display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:18px;}
  /* same size as the bottom-bar buttons */
  .wbtn{height:var(--b);display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;cursor:pointer;
    font-family:var(--font);font-weight:700;font-size:16px;padding:0 22px;border-radius:28px;}
  .wicon{width:21px;height:21px;flex:none;}
  .wbtn.again{color:var(--ink);background:var(--yellow);box-shadow:0 5px 0 var(--yellow-d);}
  .wbtn.home{color:#fff;background:var(--green-btn);box-shadow:0 5px 0 var(--green-btn-d);}
  .wbtn:active{transform:translateY(3px);}
  .wbtn.again:active{box-shadow:0 2px 0 var(--yellow-d);}
  .wbtn.home:active{box-shadow:0 2px 0 var(--green-btn-d);}

  .confetti{position:absolute;top:-10px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards;z-index:1;}
  @keyframes fall{to{transform:translateY(120vh) rotate(540deg);opacity:.9;}}
  .toast{position:absolute;bottom:120px;left:50%;transform:translateX(-50%) translateY(10px);background:#fff;color:var(--green-deep);font-weight:700;font-size:14px;padding:9px 18px;border-radius:14px;box-shadow:0 6px 16px rgba(0,0,0,.22);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:96;max-width:80%;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  /* short screens (phones on their side): tighten the spacing only — sizes stay fixed */
  @media (max-height:520px){
    .header{padding-top:calc(4px + env(safe-area-inset-top));padding-bottom:2px;}
    .pz-name{font-size:34px;padding-top:2px;}
    .controls{padding-top:4px;padding-bottom:calc(8px + env(safe-area-inset-bottom));}
    .w-slot{padding:6px 0;} .win-btns{margin-top:12px;}
  }
  /* wide and short: art on the left, message and buttons on the right */
  @media (max-height:520px) and (orientation:landscape){
    .win.open{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto minmax(0,1fr);column-gap:24px;align-items:center;}
    .win .pz-name{grid-column:1 / -1;}
    .w-slot{grid-column:1;grid-row:2;height:100%;}
    .w-text{grid-column:2;grid-row:2;}
  }
</style>
</head>
<body>

<div class="screen" id="screen">
  <div class="header" id="header">
    <button class="icon-btn" id="btn-home" title="Home" aria-label="Home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M9.5 20v-6h5v6"/></svg>
    </button>
    <div class="ttl">Jigsaw Puzzle</div>
    <button class="icon-btn" id="btn-menu" title="Menu" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="12" cy="19" r="1.9"/></svg>
    </button>
  </div>

  <div class="pz-name" id="pz-name"></div>

  <div class="play" id="play">
    <div class="guide" id="guide"></div>
  </div>

  <div class="controls">
    <button class="rnd off" id="btn-undo" title="Undo" aria-label="Undo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
    </button>
    <button class="rnd off" id="btn-redo" title="Redo" aria-label="Redo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
    </button>
    <button class="hear" id="btn-hear">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a4 4 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Hear it</span>
    </button>
    <button class="rnd" id="btn-lang" title="Language" aria-label="Language">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a13.5 13.5 0 0 1 0 18a13.5 13.5 0 0 1 0-18z"/></svg>
    </button>
    <button class="rnd" id="btn-new" title="New game" aria-label="New game">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="2"/><path d="M12 8v8"/><path d="M8 12h8"/></svg>
    </button>
  </div>

  <div class="menu" id="menu-top">
    <button class="menu-item" data-act="new"><span>New Game</span></button>
  </div>
  <div class="menu" id="menu-lang">
    <div class="menu-title">Language</div>
    <button class="menu-item" data-lang="en"><span>English</span><svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4 10-11"/></svg></button>
    <button class="menu-item" data-lang="hmnw"><span>Hmong White</span><svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4 10-11"/></svg></button>
    <button class="menu-item" data-lang="hmng"><span>Hmong Green</span><svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4 10-11"/></svg></button>
    <button class="menu-item" data-lang="es"><span>Spanish</span><svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4 10-11"/></svg></button>
  </div>

  <div class="win" id="win">
    <div class="pz-name" id="win-name"></div>
    <div class="w-slot" id="w-slot"><div class="w-card" id="w-card"><img id="w-img" alt=""></div></div>
    <div class="w-text">
    <h2>You did it!</h2>
    <p id="win-sub"></p>
    <div class="win-btns">
      <button class="wbtn home" id="win-home"><svg class="wicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M9.5 20v-6h5v6"/></svg>Home</button>
      <button class="wbtn again" id="win-again"><svg class="wicon" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="M9.6 7.2v9.6l8.2-4.8z"/></svg>Play again</button>
    </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
const GAME={"animals": [{"key": "ant", "names": {"en": "ant", "es": "hormiga", "hmnw": "ntsaum", "hmng": "ntsaum"}}, {"key": "bear", "names": {"en": "bear", "es": "oso", "hmnw": "dais", "hmng": "dlais"}}, {"key": "bird", "names": {"en": "bird", "es": "p\u00e1jaro", "hmnw": "noog", "hmng": "noog"}}, {"key": "butterfly", "names": {"en": "butterfly", "es": "mariposa", "hmnw": "npauj npaim", "hmng": "npauj npaim"}}, {"key": "cat", "names": {"en": "cat", "es": "gato", "hmnw": "miv", "hmng": "miv"}}, {"key": "chicken", "names": {"en": "chicken", "es": "gallina", "hmnw": "qaib", "hmng": "qab"}}, {"key": "cow", "names": {"en": "cow", "es": "vaca", "hmnw": "nyuj", "hmng": "nyuj"}}, {"key": "crab", "names": {"en": "crab", "es": "cangrejo", "hmnw": "roob ris", "hmng": "roob rig"}}, {"key": "crocodile", "names": {"en": "crocodile", "es": "cocodrilo", "hmnw": "kheb", "hmng": "kheb"}}, {"key": "deer", "names": {"en": "deer", "es": "venado", "hmnw": "mos lwj", "hmng": "mos lwj"}}, {"key": "dog", "names": {"en": "dog", "es": "perro", "hmnw": "dev", "hmng": "dlev"}}, {"key": "elephant", "names": {"en": "elephant", "es": "elefante", "hmnw": "ntxhw", "hmng": "ntxhw"}}, {"key": "fish", "names": {"en": "fish", "es": "pez", "hmnw": "ntses", "hmng": "ntseg"}}, {"key": "fly", "names": {"en": "fly", "es": "mosca", "hmnw": "yoov", "hmng": "yoov"}}, {"key": "fox", "names": {"en": "fox", "es": "zorro", "hmnw": "hma", "hmng": "hmaa"}}, {"key": "frog", "names": {"en": "frog", "es": "rana", "hmnw": "qav", "hmng": "qaav"}}, {"key": "goat", "names": {"en": "goat", "es": "cabra", "hmnw": "tshis", "hmng": "tshis"}}, {"key": "grasshopper", "names": {"en": "grasshopper", "es": "saltamontes", "hmnw": "kooj", "hmng": "kooj"}}, {"key": "horse", "names": {"en": "horse", "es": "caballo", "hmnw": "nees", "hmng": "neeg"}}, {"key": "mouse", "names": {"en": "mouse", "es": "rat\u00f3n", "hmnw": "nas", "hmng": "naas"}}, {"key": "peacock", "names": {"en": "peacock", "es": "pavo real", "hmnw": "yaj yuam", "hmng": "yaaj yuam"}}, {"key": "pig", "names": {"en": "pig", "es": "cerdo", "hmnw": "npua", "hmng": "npua"}}, {"key": "rabbit", "names": {"en": "rabbit", "es": "conejo", "hmnw": "luav", "hmng": "luav"}}, {"key": "snail", "names": {"en": "snail", "es": "caracol", "hmnw": "qwj", "hmng": "qwj"}}, {"key": "tiger", "names": {"en": "tiger", "es": "tigre", "hmnw": "tsov txaij", "hmng": "tsuv txaij"}}, {"key": "turtle", "names": {"en": "turtle", "es": "tortuga", "hmnw": "vaub kib", "hmng": "vaub kib"}}]};
const ANIMALS=GAME.animals;
const N=3;                    /* 3 x 3 = 9 pieces */
const ART_INSET=0.075;        /* white margin between the art and the puzzle edge, as a share of the board's short side */

let lang='en', animal=null, pieces=[], placed=0, solved=false;
let board={x:0,y:0,w:0,h:0}, cw=0, ch=0, tabU=0, pad=0, natAR=1;
let vt=[], ht=[];             /* shared tab directions */
let undoStack=[], redoStack=[];

const screenEl=document.getElementById('screen');
const headerEl=document.getElementById('header');
const playEl=document.getElementById('play');
const guideEl=document.getElementById('guide');
const nameEl=document.getElementById('pz-name');
const winEl=document.getElementById('win');
const toastEl=document.getElementById('toast');
const btnUndo=document.getElementById('btn-undo'), btnRedo=document.getElementById('btn-redo');

function toast(m){toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>toastEl.classList.remove('show'),1600);}
function word(){ return animal ? (animal.names[lang]||animal.key) : ''; }
function imgSrc(){ return 'assets/img/'+animal.key+'.png'; }

/* ---------- audio ---------- */
let au=null, audioWarned=false;
function playClip(url){ try{ if(!au){au=new Audio();au.preload='auto';} au.pause(); au.src=url; const p=au.play(); if(p&&p.catch)p.catch(err=>{ if(!audioWarned){audioWarned=true;toast('audio blocked ('+(err&&err.name||'?')+')');} }); }catch(e){} }
function playName(){ if(animal) playClip('assets/audio/'+lang+'/'+animal.key+'.mp3'); }

/* ---------- jigsaw edge geometry ----------
   One edge runs from (0,0) to (1,0) in normalized space. x is distance along
   the edge, y is how far the tab stands off it. s = +1 / -1 picks the side the
   tab bulges toward; s = 0 is a flat outer border. The curve is symmetric about
   x = 0.5, so two neighbours tracing it from opposite ends get the same shape.
   Traced from the reference: a wide neck with rounded fillets where it meets the
   edge, then a round head. */
const TAB_MAX=0.30;           /* headroom around each piece for the tabs */
function edgeSegs(s){
  if(s===0) return [['L',[[1,0]]]];
  const y=v=>v*s;
  return [
    ['L',[[0.320,0]]],
    ['C',[[0.345,0],[0.355,y(0.012)],[0.355,y(0.030)]]],
    ['C',[[0.355,y(0.075)],[0.295,y(0.100)],[0.295,y(0.155)]]],
    ['C',[[0.295,y(0.230)],[0.367,y(0.270)],[0.500,y(0.270)]]],
    ['C',[[0.633,y(0.270)],[0.705,y(0.230)],[0.705,y(0.155)]]],
    ['C',[[0.705,y(0.100)],[0.645,y(0.075)],[0.645,y(0.030)]]],
    ['C',[[0.645,y(0.012)],[0.655,0],[0.680,0]]],
    ['L',[[1,0]]]
  ];
}
/* rot = direction of travel: 0 right, 1 down, 2 left, 3 up.
   L is the edge length, T the tab unit. On longer edges the tab is squeezed
   toward the middle so every tab comes out the same physical size. */
function mapSegs(segs,ox,oy,L,T,rot){
  const k=Math.min(1,T/L);
  const sq=x=>(x>=0.999?1:(x<=0.001?0:0.5+(x-0.5)*k));
  const pt=(x0,y)=>{
    const x=sq(x0); let px,py;
    if(rot===0){px= x*L; py= y*T;}
    else if(rot===1){px=-y*T; py= x*L;}
    else if(rot===2){px=-x*L; py=-y*T;}
    else {px= y*T; py=-x*L;}
    return (ox+px).toFixed(2)+','+(oy+py).toFixed(2);
  };
  return segs.map(([cmd,pts])=>cmd+' '+pts.map(p=>pt(p[0],p[1])).join(' ')).join(' ');
}
function piecePath(r,c){
  const ox=c*cw, oy=r*ch;
  const top    = (r===0)   ?  0 :  ht[r][c];
  const right  = (c===N-1) ?  0 :  vt[r][c+1];
  const bottom = (r===N-1) ?  0 : -ht[r+1][c];
  const left   = (c===0)   ?  0 : -vt[r][c];
  return 'M '+ox.toFixed(2)+','+oy.toFixed(2)+' '
    + mapSegs(edgeSegs(top),    ox,    oy,    cw, tabU, 0)+' '
    + mapSegs(edgeSegs(right),  ox+cw, oy,    ch, tabU, 1)+' '
    + mapSegs(edgeSegs(bottom), ox+cw, oy+ch, cw, tabU, 2)+' '
    + mapSegs(edgeSegs(left),   ox,    oy+ch, ch, tabU, 3)+' Z';
}

/* ---------- layout ---------- */
function overlap(ax,ay,aw,ah,bx,by,bw,bh){
  const w=Math.min(ax+aw,bx+bw)-Math.max(ax,bx), h=Math.min(ay+ah,by+bh)-Math.max(ay,by);
  return (w>0&&h>0)?w*h:0;
}
/* Try to place all nine loose pieces around a board of this size so that no
   piece body touches the board or another piece (with a little elbow room for
   tabs). Returns the spots, or null if they don't all fit. */
function packFor(bw,bh,bias,pw,phh,strict){
  const c1=bw/N, c2=bh/N, tu=Math.min(c1,c2), pd=TAB_MAX*tu, w=c1+2*pd, h=c2+2*pd, m=tu*0.15;
  const bx0=(pw-bw)/2, by0=(phh-bh)*bias, maxX=pw-w, maxY=phh-h;
  if(maxX<0||maxY<0) return null;
  const spots=[];
  for(let k=0;k<N*N;k++){
    let best=null, bestPen=Infinity;
    for(let t=0;t<260;t++){
      const x=Math.random()*maxX, y=Math.random()*maxY, bx=x+pd, by=y+pd;
      let pen=overlap(bx,by,c1,c2,bx0-6,by0-6,bw+12,bh+12)*6;
      for(const q of spots) pen+=overlap(bx-m,by-m,c1+2*m,c2+2*m,q.x+pd-m,q.y+pd-m,c1+2*m,c2+2*m);
      if(pen<bestPen){ bestPen=pen; best={x:x,y:y}; if(pen<0.5) break; }
    }
    if(strict && bestPen>=0.5) return null;
    spots.push(best);
  }
  return {bx0:bx0, by0:by0, spots:spots};
}
let spots=[];
function measure(natW,natH){
  const pw=playEl.clientWidth, phh=playEl.clientHeight;
  if(pw<40||phh<40) return false;
  /* Follow the artwork's aspect so every piece carries some of the animal, but
     clamp it so cells never get long and thin. */
  let ar=natW/natH;
  if(!isFinite(ar)||ar<=0) ar=1;
  natAR=ar;
  ar=Math.max(0.78,Math.min(1.28,ar));
  /* Largest board, up to the mockup's proportions, that still leaves room for
     every loose piece. Search from big to small. */
  /* portrait follows the mockup's proportions; on wide screens the loose pieces
     go to the sides, so the board may use far more of the height */
  const land=pw>phh*1.25, wCap=land?0.52:0.64, hCap=land?0.86:0.54;
  const size=f=>{ let bw=Math.min(pw*wCap,Math.min(pw,phh)*f*(ar>=1?1:ar)*(land?1.6:1)), bh=bw/ar;
    if(bh>phh*hCap){ bh=phh*hCap; bw=bh*ar; } return [bw,bh]; };
  let pick=null;
  for(let f=0.78; f>=0.34 && !pick; f-=0.03){
    const [bw,bh]=size(f);
    for(const bias of [0.38,0.5]){
      for(let t=0;t<3&&!pick;t++){ const r=packFor(bw,bh,bias,pw,phh,true); if(r) pick={bw:bw,bh:bh,r:r}; }
      if(pick) break;
    }
  }
  if(!pick){ const [bw,bh]=size(0.34); pick={bw:bw,bh:bh,r:packFor(bw,bh,0.5,pw,phh,false)}; }
  const bw=pick.bw, bh=pick.bh;
  board={x:pick.r.bx0, y:pick.r.by0, w:bw, h:bh};
  cw=bw/N; ch=bh/N; tabU=Math.min(cw,ch); pad=TAB_MAX*tabU;
  spots=pick.r.spots.slice().sort(()=>Math.random()-0.5);
  guideEl.style.left=board.x+'px'; guideEl.style.top=board.y+'px';
  guideEl.style.width=bw+'px'; guideEl.style.height=bh+'px';
  return true;
}
function artBox(){
  const inset=ART_INSET*Math.min(board.w,board.h);
  return {x:inset, y:inset, w:board.w-2*inset, h:board.h-2*inset, inset:inset};
}

function setPos(p,x,y){ p.x=x; p.y=y; p.el.style.transform='translate3d('+x+'px,'+y+'px,0)'; }

/* ---------- build ---------- */
let zTop=10;
function build(keepLocked){
  const img=new Image();
  img.onload=()=>{ if(measure(img.naturalWidth,img.naturalHeight)) paint(keepLocked); };
  img.onerror=()=>{ if(measure(1,1)) paint(keepLocked); };
  img.src=imgSrc();
}
function paint(keepLocked){
  const lockedKeys = keepLocked ? pieces.filter(p=>p.locked).map(p=>p.i) : [];
  playEl.querySelectorAll('.piece').forEach(e=>e.remove());
  pieces=[]; placed=0; undoStack=[]; redoStack=[];
  const a=artBox(), src=imgSrc();
  for(let r=0;r<N;r++) for(let c=0;c<N;c++){
    const i=r*N+c;
    const d=piecePath(r,c);
    const vbX=c*cw-pad, vbY=r*ch-pad, vbW=cw+2*pad, vbH=ch+2*pad;
    const el=document.createElementNS('http://www.w3.org/2000/svg','svg');
    el.setAttribute('class','piece');
    el.setAttribute('viewBox',vbX+' '+vbY+' '+vbW+' '+vbH);
    el.style.width=vbW+'px'; el.style.height=vbH+'px';
    el.innerHTML=
      '<defs><clipPath id="cp'+i+'"><path d="'+d+'"/></clipPath></defs>'+
      '<g class="inner">'+
      '<path class="hit" d="'+d+'" fill="#ffffff"/>'+
      '<image href="'+src+'" x="'+a.x+'" y="'+a.y+'" width="'+a.w+'" height="'+a.h+'" '+
        'preserveAspectRatio="xMidYMid meet" clip-path="url(#cp'+i+')"/>'+
      '<path class="edge" d="'+d+'" fill="none" stroke="rgba(13,117,54,.28)" stroke-width="1.4" stroke-linejoin="round"/>'+
      '</g>';
    playEl.appendChild(el);
    const p={i:i,el:el,w:vbW,h:vbH,homeX:board.x+vbX,homeY:board.y+vbY,x:0,y:0,locked:false};
    pieces.push(p);
    if(lockedKeys.indexOf(i)>=0){ lock(p,true); } else { const sp=spots.pop()||{x:0,y:0}; setPos(p,sp.x,sp.y); }
    attachDrag(p);
  }
  updateGuide(); syncHist();
}

function lock(p,silent){
  p.locked=true; p.el.classList.add('locked');
  p.el.style.zIndex=1;
  setPos(p,p.homeX,p.homeY);
  placed++;
  if(!silent){ p.el.classList.add('pop'); setTimeout(()=>p.el.classList.remove('pop'),320); }
  updateGuide();
}
function unlock(p){
  p.locked=false; p.el.classList.remove('locked');
  p.el.style.zIndex=++zTop;
  placed--; updateGuide();
}
function updateGuide(){ guideEl.classList.toggle('done',placed===N*N); }

/* ---------- undo / redo ---------- */
function syncHist(){
  btnUndo.classList.toggle('off',!undoStack.length||solved);
  btnRedo.classList.toggle('off',!redoStack.length||solved);
}
function glide(p,x,y){
  p.el.classList.add('moving'); p.el.style.zIndex=p.locked?1:++zTop;
  setPos(p,x,y);
  clearTimeout(p._g); p._g=setTimeout(()=>p.el.classList.remove('moving'),320);
}
function undo(){
  const m=undoStack.pop(); if(!m||solved) return;
  const p=pieces[m.i];
  if(m.locked) unlock(p);
  glide(p,m.fx,m.fy);
  redoStack.push(m); syncHist();
}
function redo(){
  const m=redoStack.pop(); if(!m||solved) return;
  const p=pieces[m.i];
  if(m.locked){ lock(p); if(placed===N*N) setTimeout(win,420); }
  else glide(p,m.tx,m.ty);
  undoStack.push(m); syncHist();
}

/* ---------- dragging ---------- */
function attachDrag(p){
  p.el.addEventListener('pointerdown',ev=>{
    if(p.locked||solved) return;
    ev.preventDefault();
    try{ ev.target.setPointerCapture(ev.pointerId); p.capEl=ev.target; }catch(e){ p.capEl=null; }
    p.el.classList.add('dragging'); p.el.classList.remove('snapping','moving');
    p.el.style.zIndex=++zTop;
    const r=playEl.getBoundingClientRect();
    p.dx=(ev.clientX-r.left)-p.x; p.dy=(ev.clientY-r.top)-p.y;
    p.fx=p.x; p.fy=p.y;
    p.drag=true;
  });
  p.el.addEventListener('pointermove',ev=>{
    if(!p.drag) return;
    const r=playEl.getBoundingClientRect();
    let nx=(ev.clientX-r.left)-p.dx, ny=(ev.clientY-r.top)-p.dy;
    nx=Math.max(-p.w*0.3,Math.min(r.width-p.w*0.7,nx));
    ny=Math.max(-p.h*0.3,Math.min(r.height-p.h*0.7,ny));
    setPos(p,nx,ny);
  });
  const end=ev=>{
    if(!p.drag) return;
    p.drag=false; p.el.classList.remove('dragging');
    try{ if(p.capEl) p.capEl.releasePointerCapture(ev.pointerId); }catch(e){}
    let didLock=false;
    if(Math.hypot(p.x-p.homeX,p.y-p.homeY)<Math.max(26,tabU*0.42)){
      p.el.classList.add('snapping');
      lock(p); didLock=true;
      setTimeout(()=>p.el.classList.remove('snapping'),220);
    }
    if(Math.hypot(p.x-p.fx,p.y-p.fy)>3){
      undoStack.push({i:p.i,fx:p.fx,fy:p.fy,tx:p.x,ty:p.y,locked:didLock});
      redoStack=[]; syncHist();
    }
    if(didLock && placed===N*N) setTimeout(win,420);
  };
  p.el.addEventListener('pointerup',end);
  p.el.addEventListener('pointercancel',end);
}

/* ---------- win ---------- */
function winText(){
  document.getElementById('win-name').textContent=word();
  document.getElementById('win-sub').textContent='You put together the '+word()+'!';
}
function sizeWinCard(){
  if(!solved) return;
  const slot=document.getElementById('w-slot'), card=document.getElementById('w-card');
  const cs=getComputedStyle(slot);
  const sw=slot.clientWidth, sh=slot.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  /* same size as the finished puzzle when there's room, smaller when there isn't */
  const s=Math.min(1, sw/board.w, sh/board.h);
  card.style.width=(board.w*s)+'px'; card.style.height=(board.h*s)+'px';
  card.style.padding=(artBox().inset*s)+'px';
}
function win(){
  solved=true; syncHist();
  closeMenus();
  winEl.style.setProperty('--hdr',headerEl.offsetHeight+'px');
  document.getElementById('w-img').src=imgSrc();
  winText();
  screenEl.classList.add('won');
  winEl.classList.add('open');
  requestAnimationFrame(sizeWinCard);
  playName();
  confetti();
}
function confetti(){
  const cols=['#F7F750','#33b7a3','#e85f9c','#4aa0dd','#f0913f','#8a5bc9'];
  for(let i=0;i<60;i++){ const c=document.createElement('div'); c.className='confetti';
    c.style.left=Math.random()*100+'%'; c.style.background=cols[i%cols.length];
    c.style.animationDuration=(1.6+Math.random()*1.3)+'s'; c.style.animationDelay=(Math.random()*.3)+'s';
    winEl.appendChild(c); setTimeout(()=>c.remove(),3200); }
}

/* ---------- rounds ---------- */
function randomTabs(){
  vt=[]; ht=[];
  for(let r=0;r<N;r++){ vt.push([]); for(let c=0;c<=N;c++) vt[r].push(Math.random()<0.5?-1:1); }
  for(let r=0;r<=N;r++){ ht.push([]); for(let c=0;c<=N;c++) ht[r].push(Math.random()<0.5?-1:1); }
}
function newRound(){
  solved=false;
  winEl.classList.remove('open'); screenEl.classList.remove('won');
  winEl.querySelectorAll('.confetti').forEach(c=>c.remove());
  let next=animal;
  while(ANIMALS.length>1 && next===animal) next=ANIMALS[Math.floor(Math.random()*ANIMALS.length)];
  animal=next;
  randomTabs();
  nameEl.textContent=word();
  build(false);
}

/* ---------- menus ---------- */
const menuTop=document.getElementById('menu-top'), menuLang=document.getElementById('menu-lang');
function closeMenus(except){ [menuTop,menuLang].forEach(m=>{ if(m!==except) m.classList.remove('open'); }); }
function openLangMenu(){
  /* float the language list just above the globe button */
  const r=document.getElementById('btn-lang').getBoundingClientRect(), sr=screenEl.getBoundingClientRect();
  menuLang.style.top='auto';
  menuLang.style.bottom=(sr.bottom-r.top+12)+'px';
  menuLang.style.right=Math.max(12,sr.right-r.right-40)+'px';
  menuLang.classList.add('open');
}
function applyLangMark(){ document.querySelectorAll('#menu-lang .menu-item').forEach(it=>it.classList.toggle('cur',it.dataset.lang===lang)); }
function setLang(code){ lang=code; applyLangMark(); nameEl.textContent=word(); if(solved) winText(); playName(); }

document.getElementById('btn-menu').addEventListener('click',e=>{ e.stopPropagation(); const o=menuTop.classList.contains('open'); closeMenus(); if(!o) menuTop.classList.add('open'); });
document.getElementById('btn-lang').addEventListener('click',e=>{ e.stopPropagation(); const o=menuLang.classList.contains('open'); closeMenus(); if(!o) openLangMenu(); });
menuTop.addEventListener('click',e=>{ const it=e.target.closest('.menu-item'); if(!it) return; closeMenus(); if(it.dataset.act==='new') newRound(); });
menuLang.addEventListener('click',e=>{ const it=e.target.closest('.menu-item'); if(!it) return; closeMenus(); setLang(it.dataset.lang); });
document.addEventListener('click',()=>closeMenus());
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeMenus(); });

document.getElementById('btn-home').addEventListener('click',()=>{location.href='index.html';});
document.getElementById('btn-hear').addEventListener('click',playName);
btnUndo.addEventListener('click',undo);
btnRedo.addEventListener('click',redo);
document.getElementById('btn-new').addEventListener('click',newRound);
document.getElementById('win-home').addEventListener('click',()=>{location.href='index.html';});
document.getElementById('win-again').addEventListener('click',newRound);

/* keep the board sensible through rotation / resize */
let rt=null;
addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(()=>{
  if(!animal) return;
  if(solved){ winEl.style.setProperty('--hdr',headerEl.offsetHeight+'px'); sizeWinCard(); }
  else build(true);
},180); });

applyLangMark();
newRound();
/* the play area's height can still be settling on first paint (dvh, safe areas) */
requestAnimationFrame(()=>{ if(animal&&!solved) build(true); });
addEventListener('load',()=>setTimeout(()=>{ if(animal&&!solved) build(true); },80));
</script>
