<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Animal Flashcards in Hmong, English &amp; Spanish | Zoosi</title>
<meta name="description" content="Tap through animal flashcards with audio pronunciation in four languages, including Hmong. Free, and made for little ones.">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@700;800&display=swap');
  :root{
    --green-screen:#108442; --green-deep:#0D7536; --green-btn:#5CBB72; --green-btn-d:#3F9C56;
    --yellow:#F7F750; --yellow-d:#D2D244; --ink:#0D7536; --purple:#7a4fd0; --navy:#16276b;
    --font:'Baloo 2','Nunito','Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{font-family:var(--font);background:var(--green-screen);margin:0;overflow:hidden;}
  .screen{position:relative;width:100vw;height:100dvh;background:var(--green-screen);overflow:hidden;display:flex;flex-direction:column;}

  .header{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 14px 6px;color:#fff;flex:none;}
  .header .ttl{flex:1;text-align:center;font-weight:700;font-size:clamp(17px,2.4vw,22px);}
  .icon-btn{width:40px;height:40px;border:none;background:transparent;color:#eafff0;display:grid;place-items:center;cursor:pointer;border-radius:12px;}
  .icon-btn:hover{background:rgba(255,255,255,.12);}
  .icon-btn svg{width:22px;height:22px;}
  .hright{display:flex;align-items:center;gap:6px;}
  .badge{display:flex;align-items:center;gap:5px;background:var(--purple);color:#fff;font-weight:700;font-size:13px;padding:5px 11px 5px 8px;border-radius:20px;box-shadow:0 3px 0 #5c37a6;}
  .badge svg{width:16px;height:16px;}

  .prog-row{flex:none;padding:2px 18px 8px;}
  .track{height:9px;border-radius:9px;background:var(--green-deep);overflow:hidden;}
  .fill{height:100%;width:0%;border-radius:9px;background:linear-gradient(90deg,#bfe05a,#f4e352);transition:width .35s cubic-bezier(.5,1.2,.4,1);}

  .card-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px 14px 10px;}
  .card{position:relative;touch-action:none;user-select:none;will-change:transform;perspective:1400px;}
  .card-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;}
  .card-face{position:absolute;inset:0;border-radius:28px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 14px 30px rgba(0,0,0,.16);}
  .card-front{background:#fff;}
  .card-back{transform:rotateY(180deg);background-color:#fff;background-position:center;background-size:cover;background-repeat:no-repeat;}
  .card .art{position:absolute;top:8%;left:8%;right:8%;bottom:8%;display:flex;align-items:center;justify-content:center;transition:top .34s cubic-bezier(.3,1,.4,1),bottom .34s cubic-bezier(.3,1,.4,1);}
  .card .animal{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none;}
  .card:not(.hide-name) .art{top:6%;bottom:30%;}
  .card .namerow{position:absolute;left:0;right:0;bottom:8%;display:flex;align-items:center;justify-content:center;gap:16px;opacity:0;transition:opacity .28s;pointer-events:none;}
  .card .nm{font-weight:800;color:var(--navy);font-size:clamp(30px,7vw,58px);line-height:1;text-transform:lowercase;}
  .card:not(.hide-name) .namerow{opacity:1;pointer-events:auto;}
  .snd{flex:none;width:clamp(44px,9%,64px);aspect-ratio:1/1;border-radius:50%;border:none;cursor:pointer;
    background:var(--green-btn);color:var(--ink);display:grid;place-items:center;box-shadow:0 4px 0 var(--green-btn-d);transition:transform .08s;}
  .snd:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-btn-d);}
  .snd svg{width:52%;height:52%;}

  .controls{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;max-width:560px;margin:0 auto;padding:8px 16px calc(14px + env(safe-area-inset-bottom));}
  .rnd{flex:0 0 auto;width:48px;height:48px;border-radius:50%;border:none;cursor:pointer;background:var(--green-btn);color:var(--ink);display:grid;place-items:center;box-shadow:0 4px 0 var(--green-btn-d);transition:transform .08s;padding:0;}
  .rnd:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-btn-d);}
  .rnd svg{width:23px;height:23px;}
  .rnd.disabled{opacity:.4;pointer-events:none;}
  .show-name{flex:0 0 auto;width:112px;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:7px;
    border:none;cursor:pointer;font-family:var(--font);font-weight:700;font-size:15px;color:var(--ink);background:var(--green-btn);
    padding:13px 0;border-radius:26px;box-shadow:0 5px 0 var(--green-btn-d);transition:transform .08s;white-space:nowrap;}
  .show-name svg{width:19px;height:19px;flex:none;}
  .show-name .eye-closed{display:none;}
  .show-name:not(.active) .eye-open{display:none;}
  .show-name:not(.active) .eye-closed{display:inline-block;}
  .show-name:active{transform:translateY(3px);box-shadow:0 2px 0 var(--green-btn-d);}
  .show-name.active{background:var(--yellow);box-shadow:0 5px 0 var(--yellow-d);}
  .show-name.active:active{box-shadow:0 2px 0 var(--yellow-d);}

  .menu{position:absolute;z-index:70;background:#fff;border-radius:22px;padding:10px;box-shadow:0 18px 44px rgba(0,0,0,.30);min-width:200px;display:none;}
  .menu.open{display:block;animation:menuin .16s ease;}
  @keyframes menuin{from{opacity:0;transform:translateY(8px) scale(.97);}}
  #menu-lang{left:calc(50% - 103px);bottom:80px;width:206px;}
  #menu-top{top:54px;right:12px;}
  .menu-title{font-weight:800;font-size:14px;color:#8ea79a;padding:8px 14px;letter-spacing:.3px;}
  .menu-item{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;border:none;background:transparent;font-family:var(--font);font-weight:800;font-size:16px;color:#16276b;text-align:left;padding:13px 14px;border-radius:14px;cursor:pointer;}
  .menu-item:hover{background:#f2f5f2;}
  .menu-item.cur{background:#e4f3e9;color:#108442;}
  .menu-item .tick{width:18px;height:18px;color:#108442;opacity:0;flex:none;}
  .menu-item.cur .tick{opacity:1;}

  .overlay{position:absolute;inset:0;z-index:80;display:flex;flex-direction:column;background:var(--green-screen);color:#fff;padding:calc(16px + env(safe-area-inset-top)) 16px 20px;transform:translateY(-100%);transition:transform .3s cubic-bezier(.3,1,.4,1);pointer-events:none;will-change:transform;}
  .overlay.open{pointer-events:auto;}
  .ov-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-bottom:10px;}
  .ov-head h2{margin:0;font-size:20px;font-weight:800;text-align:center;}
  .ov-head .icon-btn{justify-self:start;}
  .gal-count{justify-self:end;font-weight:800;font-size:16px;color:#eafff0;padding-right:4px;}
  .gal-grid{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-content:start;padding:4px;}
  @media (max-width:520px){ .gal-grid{grid-template-columns:repeat(3,minmax(0,1fr));} }
  @media (min-width:1000px){ .gal-grid{grid-template-columns:repeat(6,minmax(0,1fr));} }
  .gal{position:relative;background:#fff;border-radius:16px;min-width:0;overflow:hidden;height:0;padding-bottom:100%;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.14);}
  .gal .gi{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px;}
  .gal .gi img{max-width:80%;max-height:64%;object-fit:contain;}
  .gal .nm{font-weight:800;color:var(--navy);font-size:12px;text-transform:lowercase;min-height:14px;}
  .gal.back .gi{padding:0;}
  .gal.back .gi img{width:100%;height:100%;max-width:none;max-height:none;object-fit:cover;}
  .gal.cur::after{content:"";position:absolute;inset:0;border-radius:16px;border:7.5px solid #F7F750;pointer-events:none;z-index:2;}

  .toast{position:absolute;bottom:92px;left:50%;transform:translateX(-50%) translateY(10px);background:#fff;color:var(--green-deep);font-weight:700;font-size:14px;padding:9px 18px;border-radius:14px;box-shadow:0 6px 16px rgba(0,0,0,.22);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:75;text-transform:capitalize;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .win{position:absolute;inset:0;z-index:90;display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:rgba(20,90,45,.94);color:#fff;text-align:center;padding:30px;backdrop-filter:blur(2px);}
  .win.show{display:flex;animation:fade .4s;}
  @keyframes fade{from{opacity:0;}}
  .win h2{font-size:clamp(26px,6vw,34px);margin:6px 0 0;font-weight:800;}
  .win p{margin:0 0 14px;opacity:.92;font-weight:600;font-size:clamp(15px,3.6vw,18px);}
  .win .emoji{font-size:64px;animation:bob 1.4s ease-in-out infinite;}
  @keyframes bob{50%{transform:translateY(-10px) rotate(-6deg);}}
  .win-btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:6px;}
  .wbtn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:none;cursor:pointer;font-family:var(--font);font-weight:800;font-size:17px;padding:14px 28px;border-radius:30px;}
  .wicon{width:20px;height:20px;flex:none;}
  .wbtn.again{color:var(--ink);background:var(--yellow);box-shadow:0 5px 0 var(--yellow-d);}
  .wbtn.home{color:#fff;background:var(--green-btn);box-shadow:0 5px 0 var(--green-btn-d);}
  .wbtn:active{transform:translateY(3px);}
  .wbtn.again:active{box-shadow:0 2px 0 var(--yellow-d);}
  .wbtn.home:active{box-shadow:0 2px 0 var(--green-btn-d);}
  .confetti{position:absolute;top:-10px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(120vh) rotate(540deg);opacity:.9;}}
</style>
</head>
<body>
<div class="screen">
  <div class="header">
    <button class="icon-btn" id="btn-home" title="Home" aria-label="Home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M9.5 20v-6h5v6"/></svg>
    </button>
    <div class="ttl">Flashcard</div>
    <button class="icon-btn" id="btn-menu" title="Menu" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="12" cy="19" r="1.9"/></svg>
    </button>
  </div>

  <div class="prog-row"><div class="track"><div class="fill" id="fill"></div></div></div>

  <div class="card-wrap"><div class="card" id="card">
    <div class="card-inner" id="card-inner">
      <div class="card-face card-front">
        <div class="art"><img class="animal" id="animal" alt="" draggable="false"></div>
        <div class="namerow">
          <span class="nm" id="nm"></span>
          <button class="snd" id="btn-sound" aria-label="Hear name">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a4 4 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
      <div class="card-face card-back" id="card-back"></div>
    </div>
  </div></div>

  <div class="controls">
    <button class="rnd" id="btn-prev" title="Previous" aria-label="Previous">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H6"/><path d="M11 6l-6 6 6 6"/></svg>
    </button>
    <button class="rnd" id="btn-gallery" title="Gallery" aria-label="Gallery">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>
    </button>
    <button class="show-name" id="btn-name" aria-label="Toggle name">
      <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/></svg>
      <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 9.5S6 15 12 15s9.5-5.5 9.5-5.5"/><path d="M6 14l-1.5 2"/><path d="M12 16v2.3"/><path d="M18 14l1.5 2"/></svg>
      <span>Name</span>
    </button>
    <button class="rnd" id="btn-lang" title="Language" aria-label="Language">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 3.6 9A14 14 0 0 1 12 21a14 14 0 0 1-3.6-9A14 14 0 0 1 12 3z"/></svg>
    </button>
    <button class="rnd" id="btn-next" title="Next" aria-label="Next">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13"/><path d="M13 6l6 6-6 6"/></svg>
    </button>
  </div>

  <div class="menu" id="menu-top">
    <button class="menu-item" data-act="new"><span>New Game</span></button>
  </div>
  <div class="menu" id="menu-lang">
    <div class="menu-title">Language</div>
    <button class="menu-item" data-lang="en"><span>English</span><svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4 10-11"/></svg></button>
    <button class="menu-item" data-lang="hmnw"><span>Hmong White</span><svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4 10-11"/></svg></button>
    <button class="menu-item" data-lang="hmng"><span>Hmong Green</span><svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4 10-11"/></svg></button>
    <button class="menu-item" data-lang="es"><span>Spanish</span><svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4 10-11"/></svg></button>
  </div>

  <div class="win" id="win">
    <div class="emoji">🎉</div>
    <h2>You found them all!</h2>
    <p id="win-sub">All animals discovered!</p>
    <div class="win-btns">
      <button class="wbtn home" id="win-home"><svg class="wicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M9.5 20v-6h5v6"/></svg>Home</button>
      <button class="wbtn again" id="win-again"><svg class="wicon" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="M9.6 7.2v9.6l8.2-4.8z"/></svg>Play again</button>
    </div>
  </div>

  <div class="overlay" id="gallery">
    <div class="ov-head"><button class="icon-btn" id="gal-close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button><h2>Gallery</h2><div class="gal-count" id="gal-count">0/0</div></div>
    <div class="gal-grid" id="gal-grid"></div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
const GAME={"animals": [{"key": "ant", "names": {"en": "ant", "es": "hormiga", "hmnw": "ntsaum", "hmng": "ntsaum"}}, {"key": "bear", "names": {"en": "bear", "es": "oso", "hmnw": "dais", "hmng": "dlais"}}, {"key": "bird", "names": {"en": "bird", "es": "p\u00e1jaro", "hmnw": "noog", "hmng": "noog"}}, {"key": "butterfly", "names": {"en": "butterfly", "es": "mariposa", "hmnw": "npauj npaim", "hmng": "npauj npaim"}}, {"key": "cat", "names": {"en": "cat", "es": "gato", "hmnw": "miv", "hmng": "miv"}}, {"key": "chicken", "names": {"en": "chicken", "es": "gallina", "hmnw": "qaib", "hmng": "qab"}}, {"key": "cow", "names": {"en": "cow", "es": "vaca", "hmnw": "nyuj", "hmng": "nyuj"}}, {"key": "crab", "names": {"en": "crab", "es": "cangrejo", "hmnw": "roob ris", "hmng": "roob rig"}}, {"key": "crocodile", "names": {"en": "crocodile", "es": "cocodrilo", "hmnw": "kheb", "hmng": "kheb"}}, {"key": "deer", "names": {"en": "deer", "es": "venado", "hmnw": "mos lwj", "hmng": "mos lwj"}}, {"key": "dog", "names": {"en": "dog", "es": "perro", "hmnw": "dev", "hmng": "dlev"}}, {"key": "elephant", "names": {"en": "elephant", "es": "elefante", "hmnw": "ntxhw", "hmng": "ntxhw"}}, {"key": "fish", "names": {"en": "fish", "es": "pez", "hmnw": "ntses", "hmng": "ntseg"}}, {"key": "fly", "names": {"en": "fly", "es": "mosca", "hmnw": "yoov", "hmng": "yoov"}}, {"key": "fox", "names": {"en": "fox", "es": "zorro", "hmnw": "hma", "hmng": "hmaa"}}, {"key": "frog", "names": {"en": "frog", "es": "rana", "hmnw": "qav", "hmng": "qaav"}}, {"key": "goat", "names": {"en": "goat", "es": "cabra", "hmnw": "tshis", "hmng": "tshis"}}, {"key": "grasshopper", "names": {"en": "grasshopper", "es": "saltamontes", "hmnw": "kooj", "hmng": "kooj"}}, {"key": "horse", "names": {"en": "horse", "es": "caballo", "hmnw": "nees", "hmng": "neeg"}}, {"key": "mouse", "names": {"en": "mouse", "es": "rat\u00f3n", "hmnw": "nas", "hmng": "naas"}}, {"key": "peacock", "names": {"en": "peacock", "es": "pavo real", "hmnw": "yaj yuam", "hmng": "yaaj yuam"}}, {"key": "pig", "names": {"en": "pig", "es": "cerdo", "hmnw": "npua", "hmng": "npua"}}, {"key": "rabbit", "names": {"en": "rabbit", "es": "conejo", "hmnw": "luav", "hmng": "luav"}}, {"key": "snail", "names": {"en": "snail", "es": "caracol", "hmnw": "qwj", "hmng": "qwj"}}, {"key": "tiger", "names": {"en": "tiger", "es": "tigre", "hmnw": "tsov txaij", "hmng": "tsuv txaij"}}, {"key": "turtle", "names": {"en": "turtle", "es": "tortuga", "hmnw": "vaub kib", "hmng": "vaub kib"}}]};
const ANIMALS=GAME.animals;
const BACK_SRC="assets/img/card_back.png";
const LANGS=[{code:'en',label:'English'},{code:'hmnw',label:'Hmong White'},{code:'hmng',label:'Hmong Green'},{code:'es',label:'Spanish'}];
let lang='en', idx=0, showName=false, won=false, pendingWin=false;

/* audio & art now load from external files under assets/ */

const card=document.getElementById('card'), animalImg=document.getElementById('animal'), nmEl=document.getElementById('nm');
const fill=document.getElementById('fill'), toastEl=document.getElementById('toast');
const enName=k=>k.replace(/_/g,' ');
let deck=ANIMALS.slice();
const seen=new Set();
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const cur=()=>deck[idx];
function resetCard(){ card.style.transition='none'; card.style.transform='translateX(0) rotate(0)'; card.style.opacity='1'; }
function syncNameBtn(){ document.getElementById('btn-name').classList.toggle('active',showName); card.classList.toggle('hide-name',!showName); }
function resetNameInstant(){
  showName=false; document.getElementById('btn-name').classList.remove('active');
  const a=card.querySelector('.art'), n=card.querySelector('.namerow');
  a.style.transition='none'; n.style.transition='none';
  card.classList.add('hide-name'); void card.offsetWidth;
  a.style.transition=''; n.style.transition='';
}
function newGame(){ deck=shuffle(ANIMALS.slice()); idx=0; seen.clear(); won=false; pendingWin=false; resetNameInstant(); resetCard(); render(); }
let busy=false;
function newGameFlip(){
  if(busy) return; busy=true; resetCard();
  const inner=document.getElementById('card-inner');
  inner.style.transition='transform .5s cubic-bezier(.4,.1,.3,1)';
  inner.style.transform='scale(.9) rotateY(180deg)';
  setTimeout(()=>{ deck=shuffle(ANIMALS.slice()); idx=0; seen.clear(); won=false; pendingWin=false; resetNameInstant(); render();
    inner.style.transform='scale(1) rotateY(360deg)';
    setTimeout(()=>{ inner.style.transition='none'; inner.style.transform='rotateY(0deg)'; busy=false; },520);
  },520);
}
const nameFor=(a)=> (a.names[lang]||a.names.en||enName(a.key));
function toast(m){toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>toastEl.classList.remove('show'),1400);}

/* audio */
let au=null, warned=false;
function playClip(url){ try{ if('speechSynthesis' in window) speechSynthesis.cancel(); if(!au){au=new Audio();au.preload='auto';} au.pause(); au.src=url; au.onended=maybeFireWin; const p=au.play(); if(p&&p.catch)p.catch(err=>{ if(!warned){warned=true;toast('audio blocked ('+(err&&err.name||'?')+')');}}); }catch(e){} }
function spanishVoice(){ const vs=(window.speechSynthesis&&speechSynthesis.getVoices())||[]; const es=vs.filter(v=>(v.lang||'').toLowerCase().startsWith('es')); if(!es.length)return null; const male=/(male|hombre|jorge|juan|diego|carlos|pablo|raul|miguel|enrique)/i; const female=/(female|mujer|monica|mónica|paulina|marisol|helena|sabina|laura|elvira|dalia|esperanza|ximena|luciana|camila|catalina|isabel|carolina)/i; const sc=v=>{const s=v.name+' '+(v.voiceURI||''); if(male.test(s))return -1; if(female.test(s))return 3; if(/google/i.test(s))return 2; return 1;}; return es.slice().sort((a,b)=>sc(b)-sc(a))[0]; }
function playName(){ const url='assets/audio/'+lang+'/'+cur().key+'.mp3'; if(url){playClip(url);return;} if(!('speechSynthesis' in window))return; const u=new SpeechSynthesisUtterance(nameFor(cur())); const v=(lang==='es')?spanishVoice():null; if(v){u.voice=v;u.lang=v.lang;} else {u.lang=(lang==='es'?'es-MX':'en-US');} u.rate=.8;u.pitch=1.15;u.onend=maybeFireWin; try{speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){} }

/* image preloading — an <img> keeps painting its OLD picture until the new one
   has decoded, which is what made the previous animal flash on the incoming card.
   Warm the file first, then swap. */
const imgCache=new Map();
function preloadKey(key){
  if(!key) return Promise.resolve();
  if(imgCache.has(key)) return imgCache.get(key);
  const p=new Promise(res=>{
    const im=new Image();
    im.onload=res; im.onerror=res;
    im.src='assets/img/'+key+'.png';
    if(im.complete) res();
  });
  imgCache.set(key,p); return p;
}
function preloadAround(i){ [i-1,i+1,i+2].forEach(n=>{ if(n>=0&&n<deck.length) preloadKey(deck[n].key); }); }
function preloadAll(){ let n=0; (function tick(){ if(n>=deck.length) return;
  preloadKey(deck[n++].key).then(()=>setTimeout(tick,60)); })(); }
function whenReady(key,cb){
  let done=false; const fire=()=>{ if(!done){ done=true; cb(); } };
  preloadKey(key).then(fire);
  setTimeout(fire,700);   /* never let one slow file stall navigation */
}

/* render */
function render(){
  seen.add(cur().key);
  animalImg.src='assets/img/'+cur().key+'.png'; animalImg.alt=cur().key;
  nmEl.textContent=nameFor(cur());
  fill.style.width=(seen.size/deck.length*100)+'%';
  card.classList.toggle('hide-name',!showName);
  document.getElementById('btn-prev').classList.toggle('disabled', idx<=0);
  document.getElementById('btn-next').classList.toggle('disabled', idx>=deck.length-1);
  if(!won && !pendingWin && seen.size>=deck.length){ pendingWin=true; }
}
let navBusy=false;
function go(step){
  if(navBusy) return;
  if(idx+step<0 || idx+step>=deck.length){ snapBack(); return; }
  const D=window.innerWidth, exit=step>0?-1:1;   /* next exits left, prev exits right */
  const nextKey=deck[idx+step].key;
  navBusy=true; preloadKey(nextKey);
  card.style.transition='transform .2s ease-in, opacity .2s';
  card.style.transform='translateX('+(exit*D)+'px) rotate('+(exit*8)+'deg)'; card.style.opacity='.15';
  setTimeout(()=>{
    whenReady(nextKey,()=>{
      idx=idx+step; resetNameInstant(); render();
      card.style.transition='none'; card.style.transform='translateX('+(-exit*D)+'px)'; card.style.opacity='1'; void card.offsetWidth;
      card.style.transition='transform .32s cubic-bezier(.2,.85,.3,1)'; card.style.transform='translateX(0) rotate(0)';
      navBusy=false; preloadAround(idx);
    });
  },185);
}
function snapBack(){ card.style.transition='transform .26s cubic-bezier(.3,1.3,.5,1),opacity .2s'; card.style.transform='translateX(0) rotate(0)'; card.style.opacity='1'; }

/* language menu */
const menuLang=document.getElementById('menu-lang'), menuTop=document.getElementById('menu-top');
function applyMark(){ document.querySelectorAll('#menu-lang .menu-item').forEach(it=>it.classList.toggle('cur',it.dataset.lang===lang)); }
function setLang(code){ lang=code; applyMark(); render(); }
function closeMenus(){ menuLang.classList.remove('open'); menuTop.classList.remove('open'); }
document.getElementById('btn-menu').addEventListener('click',e=>{ e.stopPropagation(); const o=menuTop.classList.contains('open'); closeMenus(); if(!o) menuTop.classList.add('open'); });
document.getElementById('btn-lang').addEventListener('click',e=>{ e.stopPropagation(); const o=menuLang.classList.contains('open'); closeMenus(); if(!o) menuLang.classList.add('open'); });
menuTop.addEventListener('click',e=>{ const it=e.target.closest('.menu-item'); if(!it)return; closeMenus(); newGameFlip(); });
menuLang.addEventListener('click',e=>{ const it=e.target.closest('.menu-item'); if(!it)return; closeMenus(); setLang(it.dataset.lang); });
document.addEventListener('click',closeMenus);

/* gallery */
const gallery=document.getElementById('gallery');
function buildGallery(){ const grid=document.getElementById('gal-grid'); grid.innerHTML='';
  document.getElementById('gal-count').textContent=seen.size+'/'+deck.length;
  deck.forEach((a,i)=>{ const s=seen.has(a.key); const d=document.createElement('div'); d.className='gal'+(i===idx?' cur':'')+(s?'':' back');
    d.innerHTML = s ? ('<div class="gi"><img src="assets/img/'+a.key+'.png" alt=""><div class="nm">'+nameFor(a)+'</div></div>') : ('<div class="gi"><img src="'+BACK_SRC+'" alt=""></div>');
    d.addEventListener('click',()=>{ idx=i; resetNameInstant(); closeGallery(); resetCard(); render(); }); grid.appendChild(d); }); }
function openGallery(){ buildGallery(); gallery.style.transition='transform .3s cubic-bezier(.3,1,.4,1)'; gallery.style.transform='translateY(0)'; gallery.classList.add('open'); }
function closeGallery(){ gallery.style.transition='transform .3s cubic-bezier(.3,1,.4,1)'; gallery.style.transform='translateY(-100%)'; gallery.classList.remove('open'); }
document.getElementById('btn-gallery').addEventListener('click',openGallery);
document.getElementById('gal-close').addEventListener('click',closeGallery);

/* controls */
document.getElementById('btn-prev').addEventListener('click',()=>go(-1));
document.getElementById('btn-next').addEventListener('click',()=>go(1));
document.getElementById('btn-home').addEventListener('click',()=>{location.href='index.html';});
document.getElementById('btn-name').addEventListener('click',function(){ showName=!showName; syncNameBtn(); if(showName) playName(); });
document.getElementById('btn-sound').addEventListener('click',playName);

/* gestures: swipe L/R = prev/next, swipe down = pull gallery, tap = play name */
let gx=0,gy=0,glock=null,gdown=false;
card.addEventListener('pointerdown',e=>{ if(busy)return; gx=e.clientX; gy=e.clientY; glock=null; gdown=true; try{card.setPointerCapture(e.pointerId);}catch(_){} });
card.addEventListener('pointermove',e=>{ if(!gdown)return; const dx=e.clientX-gx, dy=e.clientY-gy;
  if(!glock && Math.hypot(dx,dy)>10){ glock = Math.abs(dx)>Math.abs(dy) ? 'h' : (dy>0?'down':'up'); }
  if(glock==='h'){ let ddx=dx; if((dx>0&&idx<=0)||(dx<0&&idx>=deck.length-1)) ddx=dx*0.28; card.style.transition='none'; card.style.transform='translateX('+ddx+'px) rotate('+(ddx*0.04)+'deg)'; card.style.opacity=String(Math.max(.5,1-Math.abs(ddx)/(card.offsetWidth*1.3))); }
  else if(glock==='down'){ gallery.style.transition='none'; const p=Math.min(0,-100+(dy/window.innerHeight)*100); gallery.style.transform='translateY('+p+'%)'; }
});
card.addEventListener('pointerup',e=>{ if(!gdown)return; gdown=false; const dx=e.clientX-gx, dy=e.clientY-gy;
  if(glock==='down'){ if(dy>window.innerHeight*0.18) openGallery(); else closeGallery(); return; }
  if(glock==='h'){ const th=Math.max(60,card.offsetWidth*0.28); if(Math.abs(dx)>th) go(dx<0?1:-1); else snapBack(); return; }
  if(!showName){ showName=true; syncNameBtn(); } playName();
});
card.addEventListener('pointercancel',()=>{ if(gdown){ gdown=false; closeGallery(); } });

/* responsive card sizing */
function layout(){
  const wrap=document.querySelector('.card-wrap'); const W=wrap.clientWidth, H=wrap.clientHeight; if(W<=0||H<=0) return;
  const AR=0.66; const gapV=Math.max(12,Math.round(H*0.04)); const availW=Math.max(40,W-8), availH=H-gapV*2;
  let cw=availW, ch=cw/AR; if(ch>availH){ ch=availH; cw=ch*AR; } if(cw>availW){ cw=availW; ch=cw/AR; }
  card.style.width=Math.floor(cw)+'px'; card.style.height=Math.floor(ch)+'px';
}
let _rt; addEventListener('resize',()=>{clearTimeout(_rt);_rt=setTimeout(layout,80);});
addEventListener('orientationchange',()=>setTimeout(layout,200));
document.body.addEventListener('pointerdown',function prime(){ if('speechSynthesis' in window){try{speechSynthesis.getVoices();}catch(e){}} document.body.removeEventListener('pointerdown',prime); },{once:true});

/* congratulations overlay */
const winEl=document.getElementById('win');
function showWin(){ document.getElementById('win-sub').textContent='All '+deck.length+' animals discovered!'; winEl.classList.add('show'); confetti(); }
function maybeFireWin(){ if(pendingWin){ pendingWin=false; won=true; setTimeout(showWin,250); } }
function confetti(){ const cols=['#F7F750','#33b7a3','#e85f9c','#4aa0dd','#f0913f','#8a5bc9'];
  for(let i=0;i<70;i++){ const c=document.createElement('div'); c.className='confetti';
    c.style.left=Math.random()*100+'%'; c.style.background=cols[i%cols.length];
    c.style.animationDuration=(1.6+Math.random()*1.4)+'s'; c.style.animationDelay=(Math.random()*.4)+'s';
    winEl.appendChild(c); setTimeout(()=>c.remove(),3400); } }
document.getElementById('win-home').addEventListener('click',()=>{ location.href='index.html'; });
document.getElementById('win-again').addEventListener('click',()=>{ winEl.classList.remove('show'); winEl.querySelectorAll('.confetti').forEach(c=>c.remove()); newGameFlip(); });

document.getElementById('card-back').style.backgroundImage='url("'+BACK_SRC+'")';
applyMark(); newGame(); layout();
requestAnimationFrame(layout); addEventListener('load',()=>setTimeout(layout,60));
preloadAround(0); setTimeout(preloadAll,400);
</script>
</body>
